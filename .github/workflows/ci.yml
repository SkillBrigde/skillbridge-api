name: API CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skillbridge_checks
          POSTGRES_PASSWORD: skillbridge_checks
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillbridge_checks -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SkillBridge.slnx

      - name: Build
        run: dotnet build SkillBridge.slnx --configuration Release --no-restore --warnaserror

      - name: Verify formatting
        run: dotnet format SkillBridge.slnx --verify-no-changes --no-restore

      - name: Check logic and architecture
        run: dotnet run --project tests/SkillBridge.Checks --configuration Release --no-build

      - name: Check PostgreSQL and HTTP flows
        env:
          SKILLBRIDGE_TEST_DATABASE: Host=localhost;Port=5432;Database=postgres;Username=skillbridge_checks;Password=skillbridge_checks
        run: dotnet run --project tests/SkillBridge.Checks --configuration Release --no-build -- --database
